name: intel mac sync

# Four times a day: when zeronsh/zeron has a release newer than the Intel Mac
# app's feed (the "intel-feed" release), build it for Intel (intel-mac.yml on
# the intel-mac branch, merging the release in). Installed Intel apps then
# update themselves from the feed. A release that doesn't merge cleanly fails
# that build; it's retried at the next check.

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: intel-mac-sync

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: newest Zeron release vs the Intel feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag="$(gh api repos/zeronsh/zeron/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected release tag: $tag"; exit 1; }
          version="${tag#v}"
          current="$(gh release download intel-feed -R "$REPO" -p manifest.json -O - 2>/dev/null | jq -r '.version // empty' || true)"
          echo "zeronsh/zeron: $version, Intel feed: ${current:-none}"
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" = "$current" ]; then
            echo "up to date"
            exit 0
          fi
          running="$(gh run list -R "$REPO" -w intel-mac.yml -L 20 --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [ "$running" -gt 0 ]; then
            echo "an Intel build is already running; checking again next time"
            exit 0
          fi
          echo "building $tag for Intel"
          gh workflow run intel-mac.yml -R "$REPO" --ref intel-mac -f upstream_tag="$tag"
