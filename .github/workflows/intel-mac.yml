name: intel mac

# Zeron.app for Intel Macs (x86_64), without dictation (crates/voice: ONNX
# Runtime has no Intel macOS build). Builds the engine and the zgx app on an
# Intel runner, packages them as release.yml's macOS job does, checks the
# bundle, and publishes the dmg as a GitHub release of this repository.
# Developer ID signed and notarized when apple-release's five Apple secrets
# are configured. Without them, builds remain ad-hoc signed.
#
# The app updates itself from this repository's "intel-feed" release
# (ZERON_RELEASE_FEED, crates/update `compiled_feed`): the app tarball, the
# dmg and manifest.json for the newest build, the manifest written last.
# intel-mac-sync.yml (on main) starts this with the newest zeronsh/zeron
# release four times a day.

on:
  push:
    branches: [intel-mac]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "A zeronsh/zeron release tag to merge in before building (intel mac sync passes the newest)"
        required: false
        default: ""
      build_only:
        description: "Build and upload artifacts without changing releases or the Intel update feed"
        type: boolean
        default: false
      require_signing:
        description: "Require valid Apple signing and notarization credentials before compiling"
        type: boolean
        default: false

concurrency:
  group: intel-mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos-x86_64:
    runs-on: macos-15-intel
    environment: apple-release
    timeout-minutes: 240
    env:
      ZERON_RELEASE_FEED: https://github.com/${{ github.repository }}/releases/download/intel-feed
    steps:
      - name: check release credentials before compiling
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is required to publish Intel releases (contents and workflows write access)."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push == true' | grep -qx true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: merge the newest Zeron release
        if: inputs.upstream_tag != ''
        env:
          TAG: ${{ inputs.upstream_tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/zeronsh/zeron.git "refs/tags/$TAG:refs/tags/$TAG"
          if ! git merge --no-edit "$TAG"; then
            git diff --name-only --diff-filter=U
            echo "::error::$TAG conflicts with the intel-mac branch; merge it by hand"
            exit 1
          fi
      - name: version
        run: |
          test "$(uname -m)" = x86_64
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "ZGX_VERSION=$version" >>"$GITHUB_ENV"
          echo "BUILD_SHA=$(git rev-parse HEAD)" >>"$GITHUB_ENV"
          echo "building Zeron $version for $(uname -m), macOS $(sw_vers -productVersion)"
      # The app icon (dist/macos/Zeron.icon) compiles only with Xcode 26 or later;
      # the image's default Xcode is older. Use the newest Xcode 26 installed.
      - name: xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            ls -d /Applications/Xcode*.app || true
            echo "::error::no Xcode 26 on this runner; the app icon needs it"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
      - name: prepare signing and notarization
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          REQUIRE_SIGNING: ${{ inputs.require_signing || false }}
        run: bash scripts/intel-macos-signing.sh prepare
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # zgx's terminals are Ghostty's, built with Zig 0.16 (zgx-ghostty-sys).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/zgx-ghostty
          key: zgx-ghostty-x86_64-${{ hashFiles('apps/zgx/Cargo.lock') }}
          restore-keys: zgx-ghostty-x86_64-
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: intel-mac
          # Keep what compiled even when a later step fails, so a rerun
          # starts from there instead of from zero.
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/zgx -> target
      # The dictation stand-in: says why, never opens the microphone.
      - name: voice tests (no speech runtime on Intel)
        run: cargo test --locked -p zeron-voice --lib
      - name: no speech runtime in the build
        run: |
          if cargo tree --locked -p zeron -e normal --target x86_64-apple-darwin | grep -E '[ ─](ort|ort-sys|parakeet-rs) v[0-9]'; then
            echo "the engine still links ONNX Runtime" >&2
            exit 1
          fi
          if (cd apps/zgx && cargo tree --locked -e normal --target x86_64-apple-darwin) | grep -E '[ ─](ort|ort-sys|parakeet-rs) v[0-9]'; then
            echo "the app still links ONNX Runtime" >&2
            exit 1
          fi
      - name: dictation controls on Intel
        working-directory: apps/zgx
        run: cargo test --release --locked --test dictation
      - name: the engine, from this commit
        env:
          ZERON_ENGINE_VERSION: ${{ env.ZGX_VERSION }}
          LUAU_CXXFLAGS: -DNDEBUG
        run: cargo build --release --locked -p zeron --bin zeron-engine
      - name: package dmg
        env:
          CARGO_FLAGS: --locked
        run: ZGX_ENGINE="$GITHUB_WORKSPACE/target/release/zeron-engine" scripts/package-zgx-macos.sh
      - name: inspect the bundle
        run: |
          app="target/package-zgx/Zeron.app"
          plist="$app/Contents/Info.plist"
          plutil -p "$plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = sh.zeron.app
          test "$(plutil -extract ZeronVersion raw "$plist")" = "$ZGX_VERSION"
          test "$(plutil -extract LSMinimumSystemVersion raw "$plist")" = 13.0
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "$ZGX_VERSION.9999"
          test "$(plutil -extract ZeronEngineVersion raw "$plist")" = "$ZGX_VERSION"
          test "$("$app/Contents/MacOS/zeron" --version)" = "zeron $ZGX_VERSION"
          test -x "$app/Contents/MacOS/Zeron Engine"
          test -f "$app/Contents/Resources/ui/app.luau"
          # Intel binaries, both of them.
          for bin in "$app/Contents/MacOS/zeron" "$app/Contents/MacOS/Zeron Engine"; do
            lipo -archs "$bin"
            test "$(lipo -archs "$bin")" = x86_64
            # The app updates from this repository's intel-feed release.
            grep -qF "$ZERON_RELEASE_FEED" "$bin"
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
          test -f "target/package-zgx/zeron-$ZGX_VERSION-macos-x86_64.dmg"
          hdiutil verify "target/package-zgx/zeron-$ZGX_VERSION-macos-x86_64.dmg"
          if [ "$SIGNING_ENABLED" = true ]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
            xcrun stapler validate "target/package-zgx/zeron-$ZGX_VERSION-macos-x86_64.dmg"
          fi
          du -sh "$app"
      - name: checksums
        run: |
          cd target/package-zgx
          shasum -a 256 zeron-*-macos-x86_64.dmg zeron-*-macos-x86_64-app.tar.gz | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeron-macos-x86_64
          path: |
            target/package-zgx/*.dmg
            target/package-zgx/*.tar.gz
            target/package-zgx/SHA256SUMS.txt
          if-no-files-found: error
      - name: publish the release
        if: ${{ !inputs.build_only }}
        env:
          # A personal token: GITHUB_TOKEN may not create a tag on a commit
          # that changes .github/workflows (HTTP 403 on 2026-11-12).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          tag="intel-v$ZGX_VERSION"
          cd target/package-zgx
          files=(zeron-*-macos-x86_64.dmg zeron-*-macos-x86_64-app.tar.gz SHA256SUMS.txt)
          if [ "$SIGNING_ENABLED" = true ]; then
            signing_notes="Signed with Developer ID and notarized by Apple."
          else
            signing_notes="Ad-hoc signed: after copying Zeron.app to Applications, open it once with right-click → Open, or System Settings → Privacy & Security → Open Anyway."
          fi
          notes="Zeron $ZGX_VERSION for Intel Macs (x86_64), built from $(git rev-parse --short HEAD) (${{ github.ref_name }}${{ inputs.upstream_tag && format(' + {0}', inputs.upstream_tag) || '' }}). Installed copies update themselves from here. Dictation is not included (ONNX Runtime has no Intel macOS build). $signing_notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes "$notes" --latest
          else
            # The upstream merge exists only in this checkout. Publish its
            # commit with the tag so the release points to the code we built,
            # rather than GITHUB_SHA (the old intel-mac branch tip).
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
                push origin "$BUILD_SHA:refs/tags/$tag"
            fi
            gh release create "$tag" "${files[@]}" --verify-tag --target "$BUILD_SHA" --latest \
              --title "Zeron $ZGX_VERSION for Intel Macs" --notes "$notes"
          fi
      - name: update the app's feed
        if: ${{ !inputs.build_only }}
        env:
          # A personal token: GITHUB_TOKEN may not create a tag on a commit
          # that changes .github/workflows (HTTP 403 on 2026-11-12).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          feed=intel-feed
          cd target/package-zgx
          app="zeron-$ZGX_VERSION-macos-x86_64-app.tar.gz"
          dmg="zeron-$ZGX_VERSION-macos-x86_64.dmg"
          if ! gh release view "$feed" >/dev/null 2>&1; then
            gh release create "$feed" --target "$BUILD_SHA" --latest=false --prerelease \
              --title "Intel Mac update feed" \
              --notes "Where Zeron for Intel Macs looks for updates. Download from the intel-v* releases instead."
          fi
          # Never move the feed back to an older version (a rerun of an old build).
          current="$(gh release download "$feed" -p manifest.json -O - 2>/dev/null | jq -r '.version // empty' || true)"
          if [ -n "$current" ] && [ "$current" != "$ZGX_VERSION" ] \
            && [ "$(printf '%s\n%s\n' "$current" "$ZGX_VERSION" | sort -V | tail -1)" = "$current" ]; then
            echo "the feed already offers $current; leaving it"
            exit 0
          fi
          jq -n --arg version "$ZGX_VERSION" \
            --arg app "$app" --arg app_sha "$(shasum -a 256 "$app" | cut -d' ' -f1)" \
            --arg dmg "$dmg" --arg dmg_sha "$(shasum -a 256 "$dmg" | cut -d' ' -f1)" \
            '{version: $version, minimumMacOS: "13.0", files: {($app): {sha256: $app_sha}, ($dmg): {sha256: $dmg_sha}}}' >manifest.json
          cat manifest.json
          # The files first, the manifest last: an app never sees a version
          # whose files aren't there yet.
          gh release upload "$feed" "$app" "$dmg" --clobber
          gh release upload "$feed" manifest.json --clobber
          # Older versions' files: an app only ever fetches the manifest's.
          gh release view "$feed" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in manifest.json|"$app"|"$dmg") ;; *) gh release delete-asset "$feed" "$name" --yes ;; esac
          done
      - name: remove signing credentials from the runner
        if: always() && steps.signing.outcome != 'skipped'
        run: bash scripts/intel-macos-signing.sh cleanup
